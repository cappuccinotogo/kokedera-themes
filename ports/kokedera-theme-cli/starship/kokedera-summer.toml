# Kokedera Summer — generated from the shared Kokedera palette
"$schema" = "https://starship.rs/config-schema.json"
palette = "kokedera_summer"
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[palettes.kokedera_summer]
moss = "#2ec75a"
fern = "#7fd05f"
lantern = "#e0c565"
stone = "#99ba86"
error = "#c45a5a"
stream = "#3dbf9f"
special = "#9a7abf"

[directory]
style = "bold moss"
read_only_style = "error"

[git_branch]
style = "fern"
symbol = "git "

[git_status]
style = "special"

[cmd_duration]
style = "lantern"

[character]
success_symbol = "[>](bold moss)"
error_symbol = "[>](bold error)"
vimcmd_symbol = "[<](bold stream)"
