# Kokedera Spring — generated from the shared Kokedera palette
"$schema" = "https://starship.rs/config-schema.json"
palette = "kokedera_spring"
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[palettes.kokedera_spring]
moss = "#7ac93e"
fern = "#a8d072"
lantern = "#d4c88e"
stone = "#b2bb9a"
error = "#c45a5a"
stream = "#c98ba0"
special = "#9a7abf"

[directory]
style = "bold moss"
read_only_style = "error"

[git_branch]
style = "fern"
symbol = "git "

[git_status]
style = "special"

[cmd_duration]
style = "lantern"

[character]
success_symbol = "[>](bold moss)"
error_symbol = "[>](bold error)"
vimcmd_symbol = "[<](bold stream)"
