name: Build and validate Kokedera themes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: npm test
      # Committed ports/ and the committed Zed icon copy must match the generators.
      - run: npm run check
      - run: npm run validate
      - run: npm run validate:formats
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: kokedera-all-ports
          path: dist/

  jetbrains:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [jetbrains-theme, jetbrains-icons]
    defaults:
      run:
        working-directory: extensions/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: extensions/${{ matrix.plugin }}/build/distributions/

  vscode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: [vscode-theme, vscode-icons]
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # vsce runs vscode:prepublish, which writes the icon copy for vscode-icons.
      - run: npx --yes @vscode/vsce@3 package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extension }}
          path: extensions/${{ matrix.extension }}/*.vsix
